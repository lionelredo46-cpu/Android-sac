name: uniparent
description: "UniParent - Application mobile de suivi de la vie universitaire pour AFRAM"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # État et architecture réactive
  flutter_riverpod: ^2.5.1

  # Navigation déclarative avec guards
  go_router: ^14.2.0

  # Réseau et HTTP
  dio: ^5.4.3+1

  # Stockage sécurisé et préférences
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3

  # Connectivité & réseau
  connectivity_plus: ^6.0.3

  # Internationalisation
  intl: any

  # Design & UI Material 3
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  fl_chart: ^0.68.0
  table_calendar: ^3.1.2

  # Biométrie & Sécurité
  local_auth: ^2.2.0

  # Formulaires & OTP
  pinput: ^5.0.0

  # QR Code
  qr_flutter: ^4.1.0

  # Fichiers & utilitaires
  url_launcher: ^6.3.0
  share_plus: ^9.0.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  hive_ce: ^2.22.0
  hive_ce_flutter: ^2.5.0
  firebase_core: ^3.4.0
  firebase_messaging: ^15.1.0
  flutter_local_notifications: ^18.0.1
  mobile_scanner: ^7.3.0
  printing: ^5.13.1
  file_picker: ^8.0.7
  image_picker: ^1.2.4
  path_provider: ^2.1.6
  package_info_plus: ^9.0.1
  uuid: ^4.6.0
  timeago: ^3.7.1
  http_parser: ^4.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.17.1
  freezed: ^4.0.3
  json_serializable: ^6.15.2
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  generate: true

  assets:
    - Afram/assets/logo/
    - Afram/assets/photos/
